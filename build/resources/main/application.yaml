ktor:
  deployment:
    port: 4602
  application:
    modules:
      - com.example.configuration.ConfigureDatabaseKt.configureDatabase
      - com.example.configurations.ConfigureSerializationKt.configureSerialization
      - com.example.configurations.ConfigureDependencyInjectionKt.configureDependencyInjection
      - com.example.configurations.ConfigureRoutingKt.configureRouting

postgres:
  url: "$REVERBOT_DB_URL"
  username: "$REVERBOT_DB_USERNAME"
  password: "$REVERBOT_DB_PASSWORD"

